name: Production marketplace release gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  production-marketplace-release:
    runs-on: ubuntu-latest
    steps:
      - name: Identify release-related changes
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const paths = [
              ".github/workflows/production-marketplace-release.yml",
              "docs/canvas-authoring/SHA256SUMS",
              "docs/plugin-marketplace.md",
              "docs/release-process.md",
              "scripts/verify-plugin-marketplace.mjs",
              "test/plugin-marketplace.test.mjs",
              "test/fixtures/marketplace.candidate.json",
            ];
            const prefixes = [
              ".github/plugin/",
              "canvases/azure-functions-hosted-skills/",
              "canvases/azure-resources-query/",
              "plugins/canvas-authoring/",
            ];
            const relevant = (path) =>
              paths.includes(path) || prefixes.some((prefix) => path.startsWith(prefix));
            const verify = files.length >= 3000 || files.some(({ filename, previous_filename }) =>
              relevant(filename) || (previous_filename && relevant(previous_filename)));
            core.setOutput("verify", verify ? "true" : "false");
            core.info(verify ? "Run strict marketplace verification." : "Unrelated changes; skip marketplace verification.");
      - uses: actions/checkout@v4
        if: steps.changes.outputs.verify == 'true'
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.verify == 'true'
        with:
          node-version: '22'
      - name: Test marketplace policy
        if: steps.changes.outputs.verify == 'true'
        run: node --test test/plugin-marketplace.test.mjs
      - name: Verify production marketplace against release tags
        if: steps.changes.outputs.verify == 'true'
        run: node scripts/verify-plugin-marketplace.mjs
