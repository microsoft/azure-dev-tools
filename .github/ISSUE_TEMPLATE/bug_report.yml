name: Bug report
description: Report a problem in a released canvas package.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for released Azure Functions Hosted Skills or Azure Resources Query canvas-package content. Check that the package is published before reporting installation or runtime issues. Do not include secrets or security vulnerabilities.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Identify the released canvas package and describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Provide the smallest reproducible steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
